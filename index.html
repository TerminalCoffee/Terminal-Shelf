<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal Shelf</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components/button.css">
  <link rel="stylesheet" href="assets/css/components/card.css">
  <link rel="stylesheet" href="assets/css/components/chip.css">
</head>
<body>
  <main class="center">
    <h1>Terminal Shelf</h1>
    <p>Personal collection manager. Foundation in progress.</p>
    <div class="cluster">
      <button class="button" data-color="primary">Cadastrar</button>
      <button class="button">Buscar</button>
      <span class="chip"><span class="dot"></span>reading</span>
    </div>
    <article class="card">
      <h3 class="card__title">O nome da rosa</h3>
      <p class="card__body">Umberto Eco — planejado</p>
      <footer class="card__footer">
        <div class="cluster">
          <button class="button">Detalhes</button>
          <span class="chip"><span class="dot"></span>planned</span>
        </div>
      </footer>
    </article>
  </main>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
